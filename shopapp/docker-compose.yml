services:
  mysql:
    image: mysql:8.0
    container_name: shopapp_mysql
    restart: no
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-shopapp}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-sa123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopapp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD:-sa123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  liquibase:
    image: liquibase/liquibase:5.0.1
    container_name: shopapp_liquibase
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src/main/resources/db/changelog:/liquibase/changelog
      - ~/.m2/repository/com/mysql/mysql-connector-j/8.0.33/mysql-connector-j-8.0.33.jar:/liquibase/lib/mysql.jar
    working_dir: /liquibase
    networks:
      - shopapp_network
    entrypoint:
      - liquibase
      - --search-path=/liquibase/changelog
      - --changelog-file=db.changelog-master.yml
      - --url=jdbc:mysql://mysql:3306/${MYSQL_DB:-shopapp}
      - --username=${DB_USERNAME:-root}
      - --password=${MYSQL_PASSWORD:-sa123}

  redis:
    image: redis:8-alpine
    container_name: shopapp_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123}"]
    restart: no
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  shopapp_network:
    driver: bridge
